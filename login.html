<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Equipo de Selección — Acceso</title>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Tema "Editorial" (igual que el panel): arena, azul acero, pizarra y marco navy. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Open Sans', -apple-system, 'Segoe UI', sans-serif;
      background: #F1EEE9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .card {
      position: relative;
      overflow: hidden;
      background: #FFFFFF;
      border: 1px solid #E4DED4;
      border-radius: 6px;
      padding: 40px 52px 48px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 2px 4px rgba(43,58,74,0.06), 0 12px 32px rgba(43,58,74,0.12);
      text-align: center;
    }
    /* marco tipo diapositiva: barra navy a la derecha con filete acero y banda abajo */
    .card::before {
      content: "";
      position: absolute; top: 0; right: 0; bottom: 0;
      width: 14px;
      background: #2B3A4A;
      border-left: 5px solid #3F6189;
    }
    .card::after {
      content: "";
      position: absolute; left: 0; right: 0; bottom: 0;
      height: 8px;
      background: #2B3A4A;
    }

    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 26px;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      background: #3F6189;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon svg {
      width: 22px;
      height: 22px;
      fill: white;
    }

    .logo-text {
      font-size: 13px;
      font-weight: 700;
      color: #22303C;
      letter-spacing: 0.08em;
    }

    .logo-sub {
      font-size: 11px;
      font-weight: 600;
      color: #7A8691;
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }

    h1 {
      font-family: 'Marcellus', Georgia, serif;
      font-size: 24px;
      font-weight: 400;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: #3D5A62;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 13px;
      color: #7A8691;
      margin-bottom: 28px;
    }

    label {
      display: block;
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      color: #475763;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      background: #FFFFFF;
      border: 1px solid #D3CBBE;
      border-radius: 8px;
      color: #22303C;
      font-family: inherit;
      font-size: 14px;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      margin-bottom: 16px;
    }

    input:focus {
      border-color: #3F6189;
      box-shadow: 0 0 0 3px #E8EDF4;
    }

    button {
      width: 100%;
      background: #2B3A4A;
      color: white;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border: none;
      border-radius: 999px;
      padding: 13px;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.2s;
    }

    button:hover { background: #3F6189; }
    button:active { background: #24323D; }

    .error {
      display: none;
      background: #F8E5E3;
      border: 1px solid #EBC3BE;
      color: #A8453C;
      font-size: 13px;
      border-radius: 8px;
      padding: 10px 14px;
      margin-top: 12px;
      text-align: center;
    }

    .error.visible { display: block; }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
      </svg>
    </div>
    <div>
      <div class="logo-text">GastroBA</div>
      <div class="logo-sub">Equipo de Selección</div>
    </div>
  </div>

  <h1>Bienvenido</h1>
  <p class="subtitle">Ingresá tus credenciales para continuar</p>

  <label for="usuario">Usuario</label>
  <input type="text" id="usuario" placeholder="nombre de usuario" autocomplete="username" />

  <label for="clave">Contraseña</label>
  <input type="password" id="clave" placeholder="••••••••" autocomplete="current-password" />

  <button onclick="login()">Ingresar</button>

  <div class="error" id="error">Usuario o contraseña incorrectos.</div>
</div>

<script>
  // ─── CONFIGURACIÓN ───────────────────────────────────────────
  const USUARIO = "Admin";
  const CLAVE   = "rrhh2026";
  // Página principal; si se llegó desde un link (ej. un informe), se vuelve ahí.
  // Solo páginas de este sitio ("informe.html?..."), nunca otra dirección.
  const VOLVER  = new URLSearchParams(window.location.search).get("volver") || "";
  const DESTINO = /^[\w-]+\.html(\?[^#]*)?$/.test(VOLVER) ? VOLVER : "index.html";
  // ─────────────────────────────────────────────────────────────

  function login() {
    const u = document.getElementById("usuario").value.trim();
    const c = document.getElementById("clave").value;

    if (u === USUARIO && c === CLAVE) {
      sessionStorage.setItem("rrhh_auth", "true");
      window.location.href = DESTINO;
    } else {
      document.getElementById("error").classList.add("visible");
    }
  }

  // Permitir Enter para enviar
  document.addEventListener("keydown", e => {
    if (e.key === "Enter") login();
  });

  // Si ya está autenticado, redirigir directo
  if (sessionStorage.getItem("rrhh_auth") === "true") {
    window.location.href = DESTINO;
  }
</script>

</body>
</html>
